apiVersion: apps/v1
kind: Deployment
metadata:
  name: olp-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: olp-backend
  template:
    metadata:
      labels:
        app: olp-backend
    spec:
      containers:
        - name: backend
          image: olp-backend:latest
          ports:
            - containerPort: 8000
